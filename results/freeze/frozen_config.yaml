statistics:
  primary:
    comparison:
    - main
    - A1
    horizon_steps: 4
    test: one-sided exact Wilcoxon signed-rank on event-wise nRMSE differences, 13 scored events, p < 0.05; the other five
      horizons secondary, with Holm
  secondary_family:
    test: two-sided exact Wilcoxon signed-rank at 1 h on the 13 scored events, Holm across the family; Hodges-Lehmann effect
      sizes
    level: two forecasters are level when their medians differ by less than 3% (guide 3.10)
    wording:
      below 3%, not significant after Holm: level
      below 3%, significant after Holm: consistently lower, by less than 3%
      from 3%: the difference is named with its p-value
    comparisons:
    - - LGB
      - main
    - - A6a
      - main
    - - A6b
      - main
    - - A6d
      - main
    - - A6e
      - main
    - - weighted PVSetFormer + Chronos-2
      - A6a
    - - weighted TimeXer + Chronos-2
      - A6a
    - - weighted LightGBM + Chronos-2
      - A6a
